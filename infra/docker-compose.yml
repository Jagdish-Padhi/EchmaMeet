services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports:
      # Control API
      - '127.0.0.1:8474:8474'
      # Proxy listen ports used by smoke tests and experiments
      - '127.0.0.1:28000-28099:28000-28099'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  chaosboard:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      - PARTNER_BASE_URL=${PARTNER_BASE_URL:-https://api.meta.ai/v1}
      - PARTNER_API_KEY=${PARTNER_API_KEY:-}
      - PARTNER_MODEL_ID=${PARTNER_MODEL_ID:-muse-spark-1.3}
      - META_API_KEY=${META_API_KEY:-}
      - META_BUDGET_USD=${META_BUDGET_USD:-150}
      - META_RESERVE_USD=${META_RESERVE_USD:-40}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - TOXIPROXY_URL=http://toxiproxy:8474
      - DATA_DIR=/data
    ports:
      - '3000:3000'
    volumes:
      - chaosboard-data:/data
    depends_on:
      - toxiproxy
    restart: unless-stopped

  # TURN relay for WebRTC media when peers cannot connect directly. Set TURN_SHARED_SECRET and
  # TURN_URLS=turn:<public-ip>:3478?transport=udp in .env. Credentials are issued per user.
  coturn:
    image: coturn/coturn:4.6.2
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?set TURN_SHARED_SECRET}
      - --realm=echmameet
      - --fingerprint
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
      - --min-port=49160
      - --max-port=49200
    profiles: ['turn']
    restart: unless-stopped

volumes:
  chaosboard-data:
